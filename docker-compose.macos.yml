# macOS override: use Ollama already running on the host laptop.
# Run: docker compose -f docker-compose.yml -f docker-compose.macos.yml up --build
services:
  ml-services:
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
