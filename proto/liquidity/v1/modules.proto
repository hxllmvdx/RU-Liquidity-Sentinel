syntax = "proto3";

package liquidity.v1;

import "liquidity/v1/common.proto";

option go_package = "github.com/your-org/ru-liquidity-sentinel/backend/gen/go/liquidity/v1;liquidityv1";

message ModuleSignal {
  string date = 1;
  ModuleId module_id = 2;
  string signal_name = 3;
  double raw_value = 4;
  double mad_score = 5;
  bool flag = 6;
  string unit = 7;
}

message ModuleFeature {
  string date = 1;
  ModuleId module_id = 2;
  string feature_name = 3;
  double value = 4;
  string unit = 5;
}

message ActiveFlag {
  string flag_name = 1;
  ModuleId module_id = 2;
  string description = 3;
  double severity = 4;
}

message GetModuleSignalsRequest {
  ModuleId module_id = 1;
  DateRange range = 2;
}

message GetModuleSignalsResponse {
  ModuleId module_id = 1;
  repeated ModuleSignal signals = 2;
  repeated ActiveFlag active_flags = 3;
}

message GetAllModulesSnapshotRequest {
  string date = 1;
}

message ModuleSnapshot {
  ModuleId module_id = 1;
  string module_name = 2;
  double module_score = 3;
  repeated ModuleSignal signals = 4;
  repeated ActiveFlag active_flags = 5;
}

message GetAllModulesSnapshotResponse {
  string date = 1;
  repeated ModuleSnapshot modules = 2;
}
