syntax = "proto3";

package liquidity.v1;

import "liquidity/v1/analyst.proto";
import "liquidity/v1/backtest.proto";
import "liquidity/v1/lsi.proto";
import "liquidity/v1/modules.proto";
import "liquidity/v1/scenario.proto";

option go_package = "github.com/your-org/ru-liquidity-sentinel/backend/gen/go/liquidity/v1;liquidityv1";

service LiquidityService {
  rpc GetCurrentLSI(GetCurrentLSIRequest) returns (LSIResponse);
  rpc GetLSIHistory(GetLSIHistoryRequest) returns (GetLSIHistoryResponse);

  rpc RecalculateLSI(RecalculateLSIRequest) returns (RecalculateLSIResponse);
  rpc GetModuleSignals(GetModuleSignalsRequest) returns (GetModuleSignalsResponse);
  rpc GetAllModulesSnapshot(GetAllModulesSnapshotRequest) returns (GetAllModulesSnapshotResponse);
  rpc RunScenario(RunScenarioRequest) returns (ScenarioResponse);
  rpc GetBacktest(GetBacktestRequest) returns (BacktestResponse);
  rpc GenerateAutoComment(GenerateAutoCommentRequest) returns (AutoCommentResponse);
  rpc ChatAnalyst(ChatRequest) returns (ChatResponse);
}
