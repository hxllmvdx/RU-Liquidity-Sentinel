syntax = "proto3";

package liquidity.v1;

option go_package = "github.com/your-org/ru-liquidity-sentinel/backend/gen/go/liquidity/v1;liquidityv1";

// Traffic-light status for current or forecast liquidity stress conditions.
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_GREEN = 1;
  STATUS_YELLOW = 2;
  STATUS_RED = 3;
}

// Canonical identifiers for the five domain modules used in LSI.
enum ModuleId {
  MODULE_ID_UNSPECIFIED = 0;
  MODULE_ID_M1_RESERVES = 1;
  MODULE_ID_M2_REPO = 2;
  MODULE_ID_M3_OFZ = 3;
  MODULE_ID_M4_TAX = 4;
  MODULE_ID_M5_TREASURY = 5;
}

// Inclusive date interval in ISO-8601 string form.
message DateRange {
  string from = 1;
  string to = 2;
}

// Offset-based pagination used by history endpoints.
message Pagination {
  int32 limit = 1;
  int32 offset = 2;
}

// Generic structured error payload for future envelope usage.
message ErrorInfo {
  string code = 1;
  string message = 2;
}

// Time-series point with a date and scalar value.
message DataPoint {
  string date = 1;
  double value = 2;
}

// Named scalar value used by summaries and lightweight explainability payloads.
message NamedValue {
  string name = 1;
  double value = 2;
}
