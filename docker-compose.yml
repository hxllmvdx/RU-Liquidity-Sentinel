services:
    postgres:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    redis:
        image: redis:7-alpine
        ports:
            - "${REDIS_PORT}:6379"

    ollama:
        image: ollama/ollama:latest
        ports:
            - "11434:11434"
        volumes:
            - ollama_data:/root/.ollama

    backend:
        build:
            context: .
            dockerfile: infra/docker/backend.Dockerfile
        env_file:
            - .env
        environment:
            ML_GRPC_ADDR: ml-services:50051
            BACKEND_HTTP_ADDR: :8080
        depends_on:
            - postgres
            - redis
            - ml-services
        ports:
            - "${BACKEND_PORT}:8080"

    ml-services:
        build:
            context: .
            dockerfile: infra/docker/ml-services.Dockerfile
        env_file:
            - .env
        environment:
            ML_GRPC_PORT: 50051
        depends_on:
            - postgres
            - redis
            - ollama
        ports:
            - "${ML_GRPC_PORT}:50051"

    frontend:
        build:
            context: .
            dockerfile: infra/docker/frontend.Dockerfile
        env_file:
            - .env
        environment:
            BACKEND_INTERNAL_URL: http://backend:8080
        depends_on:
            - backend
        ports:
            - "${FRONTEND_PORT}:3000"

volumes:
    postgres_data:
    ollama_data:
