services:
    postgres:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    db-migrations:
        image: pgvector/pgvector:pg16
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ./infra/postgres/init.sql:/migrations/init.sql:ro
            - ./db/migrations:/migrations/files:ro
        command:
            [
                "sh",
                "-lc",
                "psql postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres:5432/$$POSTGRES_DB -v ON_ERROR_STOP=1 -f /migrations/init.sql"
            ]

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "no"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        ports:
            - "${REDIS_PORT}:6379"

    backend:
        build:
            context: .
            dockerfile: infra/docker/backend.Dockerfile
        env_file:
            - .env
        environment:
            ML_GRPC_ADDR: ml-services:50051
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/ru_liquidity_sentinel?sslmode=disable
            BACKEND_HTTP_ADDR: :8080
            REDIS_ENABLED: ${REDIS_ENABLED}
            REDIS_ADDR: redis:6379
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_DB: ${REDIS_DB}
            REDIS_DEFAULT_TTL_SECONDS: ${REDIS_DEFAULT_TTL_SECONDS}
            REDIS_DASHBOARD_TTL_SECONDS: ${REDIS_DASHBOARD_TTL_SECONDS}
            REDIS_LSI_TTL_SECONDS: ${REDIS_LSI_TTL_SECONDS}
            REDIS_MODULES_TTL_SECONDS: ${REDIS_MODULES_TTL_SECONDS}
            REDIS_MODULE_SIGNALS_TTL_SECONDS: ${REDIS_MODULE_SIGNALS_TTL_SECONDS}
            REDIS_LSI_HISTORY_TTL_SECONDS: ${REDIS_LSI_HISTORY_TTL_SECONDS}
            REDIS_JOB_TTL_SECONDS: ${REDIS_JOB_TTL_SECONDS}
            REDIS_LOCK_TTL_SECONDS: ${REDIS_LOCK_TTL_SECONDS}
            REDIS_BACKTEST_TTL_SECONDS: ${REDIS_BACKTEST_TTL_SECONDS}
        depends_on:
            db-migrations:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
            ml-services:
                condition: service_healthy
        ports:
            - "${BACKEND_PORT}:8080"

    ml-services:
        build:
            context: .
            dockerfile: infra/docker/ml-services.Dockerfile
        env_file:
            - .env
        environment:
            ML_GRPC_PORT: 50051
            # Important: override .env DATABASE_URL. Inside Docker, localhost is the ml-services
            # container itself, not PostgreSQL. Use the postgres service DNS name.
            DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ru_liquidity_sentinel}?sslmode=disable
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_DB: ${POSTGRES_DB:-ru_liquidity_sentinel}
            POSTGRES_USER: ${POSTGRES_USER:-postgres}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
            POSTGRES_SSLMODE: disable
            RLS_BOOTSTRAP_HISTORY_ON_STARTUP: ${RLS_BOOTSTRAP_HISTORY_ON_STARTUP:-true}
            RLS_BOOTSTRAP_HISTORY_FROM: ${RLS_BOOTSTRAP_HISTORY_FROM:-2021-01-01}
            RLS_BOOTSTRAP_RUN_HISTORICAL_PARSERS: ${RLS_BOOTSTRAP_RUN_HISTORICAL_PARSERS:-true}
            RLS_BOOTSTRAP_FORCE_HISTORICAL_PARSERS: ${RLS_BOOTSTRAP_FORCE_HISTORICAL_PARSERS:-true}
            RLS_BOOTSTRAP_MIN_HISTORY_ROWS: ${RLS_BOOTSTRAP_MIN_HISTORY_ROWS:-1000}
            RLS_PROCESSING_SCRIPT_TIMEOUT_SECONDS: ${RLS_PROCESSING_SCRIPT_TIMEOUT_SECONDS:-1200}
            OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
            OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
            PYTHONPATH: /app/ml-services:/app/ml-services/gen/python
        volumes:
            - ./data:/app/data
        healthcheck:
            test: ["CMD-SHELL", "python -c 'import socket; s=socket.create_connection((\"127.0.0.1\", 50051), 2); s.close()'"]
            interval: 10s
            timeout: 5s
            retries: 120
            start_period: 1800s
        depends_on:
            db-migrations:
                condition: service_completed_successfully
            redis:
                condition: service_started
        ports:
            - "${ML_GRPC_PORT}:50051"

    frontend:
        build:
            context: .
            dockerfile: infra/docker/frontend.Dockerfile
        env_file:
            - .env
        environment:
            BACKEND_INTERNAL_URL: http://backend:8080
        depends_on:
            - backend
        ports:
            - "${FRONTEND_PORT}:3000"

volumes:
    postgres_data:
