services:
    postgres:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
                ]
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s
        ports:
            - "${POSTGRES_PORT}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    db-migrations:
        image: pgvector/pgvector:pg16
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - ./infra/postgres/init.sql:/migrations/init.sql:ro
            - ./db/migrations:/migrations/files:ro
        command:
            [
                "sh",
                "-lc",
                "psql postgresql://$$POSTGRES_USER:$$POSTGRES_PASSWORD@postgres:5432/$$POSTGRES_DB -v ON_ERROR_STOP=1 -f /migrations/init.sql"
            ]

    redis:
        image: redis:7-alpine
        command: ["redis-server", "--appendonly", "no"]
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        ports:
            - "${REDIS_PORT}:6379"

    ollama:
        image: ollama/ollama:latest
        ports:
            - "11434:11434"
        volumes:
            - ollama_data:/root/.ollama

    backend:
        build:
            context: .
            dockerfile: infra/docker/backend.Dockerfile
        env_file:
            - .env
        environment:
            ML_GRPC_ADDR: ml-services:50051
            BACKEND_HTTP_ADDR: :8080
            REDIS_ENABLED: ${REDIS_ENABLED}
            REDIS_ADDR: redis:6379
            REDIS_PASSWORD: ${REDIS_PASSWORD}
            REDIS_DB: ${REDIS_DB}
            REDIS_DEFAULT_TTL_SECONDS: ${REDIS_DEFAULT_TTL_SECONDS}
            REDIS_DASHBOARD_TTL_SECONDS: ${REDIS_DASHBOARD_TTL_SECONDS}
            REDIS_LSI_TTL_SECONDS: ${REDIS_LSI_TTL_SECONDS}
            REDIS_MODULES_TTL_SECONDS: ${REDIS_MODULES_TTL_SECONDS}
            REDIS_MODULE_SIGNALS_TTL_SECONDS: ${REDIS_MODULE_SIGNALS_TTL_SECONDS}
            REDIS_LSI_HISTORY_TTL_SECONDS: ${REDIS_LSI_HISTORY_TTL_SECONDS}
            REDIS_JOB_TTL_SECONDS: ${REDIS_JOB_TTL_SECONDS}
            REDIS_LOCK_TTL_SECONDS: ${REDIS_LOCK_TTL_SECONDS}
            REDIS_BACKTEST_TTL_SECONDS: ${REDIS_BACKTEST_TTL_SECONDS}
        depends_on:
            db-migrations:
                condition: service_completed_successfully
            redis:
                condition: service_healthy
            ml-services:
                condition: service_started
        ports:
            - "${BACKEND_PORT}:8080"

    ml-services:
        build:
            context: .
            dockerfile: infra/docker/ml-services.Dockerfile
        env_file:
            - .env
        environment:
            ML_GRPC_PORT: 50051
        depends_on:
            db-migrations:
                condition: service_completed_successfully
            redis:
                condition: service_started
            ollama:
                condition: service_started
        ports:
            - "${ML_GRPC_PORT}:50051"

    frontend:
        build:
            context: .
            dockerfile: infra/docker/frontend.Dockerfile
        env_file:
            - .env
        environment:
            BACKEND_INTERNAL_URL: http://backend:8080
        depends_on:
            - backend
        ports:
            - "${FRONTEND_PORT}:3000"

volumes:
    postgres_data:
    ollama_data:
